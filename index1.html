<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: white;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #message {
            display: none; /* يتم إظهاره فقط عند عدم وجود رابط */
        }
    </style>
</head>
<body>

    <video id="videoPlayer" controls autoplay></video>
    <div id="message">
        <h1>عذراً، لم يتم تحديد رابط للبث.</h1>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('videoPlayer');
            const messageDiv = document.getElementById('message');
            
            // 1. قراءة رابط البث من رابط الصفحة
            const params = new URLSearchParams(window.location.search);
            const streamUrl = params.get('stream'); // سنقوم بتمرير الرابط تحت اسم "stream"

            if (streamUrl) {
                // 2. التحقق إذا كان المتصفح يدعم HLS
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(decodeURIComponent(streamUrl));
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // للمتصفحات التي تدعم HLS أصلاً (مثل Safari)
                    video.src = decodeURIComponent(streamUrl);
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                    });
                }
            } else {
                // إذا لم يتم تمرير رابط، نعرض رسالة خطأ
                video.style.display = 'none';
                messageDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>

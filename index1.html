<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr Player</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playerElement = document.getElementById('player');
            
            // قراءة رابط البث من رابط الصفحة
            const params = new URLSearchParams(window.location.search);
            let streamUrl = params.get('stream');

            if (streamUrl) {
                // فك تشفير الرابط القادم من البوت
                streamUrl = decodeURIComponent(streamUrl);

                // استخدام البروكسي لمحاولة تجاوز مشاكل الحماية
                const proxyUrl = 'https://corsproxy.io/?';
                const proxiedStreamUrl = proxyUrl + encodeURIComponent(streamUrl);

                // تهيئة مشغل Clappr
                const player = new Clappr.Player({
                    source: proxiedStreamUrl, // رابط البث
                    parentId: "#player",      // مكان وضع المشغل
                    width: '100%',
                    height: '100%',
                    autoPlay: true,           // تشغيل تلقائي
                    poster: 'https://i.ibb.co/L8y26Vn/placeholder.png', // صورة تظهر قبل بدء التحميل
                    clapprLogo: 'https://clappr.io/img/logo-symbol.png', // يمكنك إزالة هذا السطر لإخفاء شعار Clappr
                    hlsjsConfig: {
                        // إعدادات متقدمة إذا احتجت لها
                        maxMaxBufferLength: 60,
                    },
                });

            } else {
                playerElement.innerHTML = '<h1 style="color:white; text-align:center; padding-top: 40vh;">عذراً، لم يتم تحديد رابط للبث.</h1>';
            }
        });
    </script>

</body>
</html>

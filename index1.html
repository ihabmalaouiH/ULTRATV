<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* لمنع ظهور أي scrollbars */
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
        }
        #play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }
        #play-button {
            width: 0;
            height: 0;
            border-top: 50px solid transparent;
            border-bottom: 50px solid transparent;
            border-left: 80px solid rgba(200, 200, 200, 0.8);
            transition: transform 0.2s;
        }
        #play-overlay:hover #play-button {
            transform: scale(1.1);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="play-overlay">
            <div id="play-button"></div>
        </div>
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('videoPlayer');
            const playOverlay = document.getElementById('play-overlay');
            
            const params = new URLSearchParams(window.location.search);
            let streamUrl = params.get('stream');

            if (streamUrl) {
                // فك تشفير الرابط أولاً
                streamUrl = decodeURIComponent(streamUrl);

                // استخدام بروكسي وسيط لمحاولة تجاوز مشاكل CORS
                // هذا يزيد من فرصة عمل الرابط
                const proxyUrl = 'https://corsproxy.io/?';
                const proxiedStreamUrl = proxyUrl + encodeURIComponent(streamUrl);

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(proxiedStreamUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedStreamUrl;
                }
            } else {
                // في حال عدم وجود رابط، يتم إخفاء المشغل وإظهار رسالة
                document.getElementById('player-container').innerHTML = '<h1 style="color:white;">عذراً، لم يتم تحديد رابط للبث.</h1>';
            }

            // عند الضغط على زر التشغيل الكبير
            playOverlay.addEventListener('click', () => {
                playOverlay.classList.add('hidden'); // إخفاء الزر
                video.play(); // تشغيل الفيديو
            });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr Player</title>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-hlsjs-playback@latest/dist/hlsjs-playback.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000;
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playerElement = document.getElementById('player');
            const params = new URLSearchParams(window.location.search);
            let streamUrl = params.get('stream');

            if (streamUrl) {
                streamUrl = decodeURIComponent(streamUrl);
                const proxyUrl = 'https://corsproxy.io/?';
                const proxiedStreamUrl = proxyUrl + encodeURIComponent(streamUrl);

                // تهيئة مشغل Clappr مع إضافة الـ plugin
                const player = new Clappr.Player({
                    source: proxiedStreamUrl,
                    parentId: "#player",
                    width: '100%',
                    height: '100%',
                    autoPlay: true,
                    // ✅ This is the crucial addition
                    // نخبر Clappr أن يستخدم الـ plugin الذي أضفناه
                    plugins: {
                        playback: [HlsjsPlayback]
                    },
                    hlsjsConfig: {
                        // إعدادات متقدمة لتحسين الأداء
                        maxMaxBufferLength: 60,
                        abrEwmaDefaultEstimate: 5000000, // Start with a higher quality guess
                    },
                });

            } else {
                playerElement.innerHTML = '<h1 style="color:white; text-align:center; padding-top: 40vh;">عذراً، لم يتم تحديد رابط للبث.</h1>';
            }
        });
    </script>

</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - ULTRA TV (الجزائر)</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --bg-card: #1e293b;
    --border: #334155;
    --primary: #3b82f6;
    --success: #22c55e;
    --warning: #eab308;
    --danger: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; outline: none; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    padding: 20px;
    margin: 0;
    font-size: 14px;
  }
    
  h1 { font-size: 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--primary); }
  
  /* --- تنسيق الشبكة (Grid) --- */
  .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 1200px) { .dashboard-grid { grid-template-columns: 3fr 1fr; } }

  /* --- شريط التحكم (Organized Controls) --- */
  .controls {
    background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  .controls > * { margin-bottom: 0; }

  input, select, button, textarea {
    padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
    background: #0f172a; color: var(--text); font-size: 13px; transition: all 0.2s;
    height: 40px; display: inline-flex; align-items: center;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    
  button { cursor: pointer; font-weight: 600; gap: 6px; justify-content: center; white-space: nowrap; }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    
  .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
  .btn-success { background: var(--success); border-color: var(--success); color: white; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: white; }
  .btn-github { background: #24292e; border-color: #24292e; color: white; }

  /* --- شريط الإحصائيات --- */
  .stats-bar { display: flex; gap: 15px; margin-top: 10px; font-weight: bold; color: var(--text-muted); font-size: 13px; flex-wrap: wrap; }
  .stat-item b { color: var(--text); margin-left: 4px; }

  /* --- الجدول (Organized Table) --- */
  .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); width: 100%; background: var(--bg-card); }
  table { width: 100%; border-collapse: collapse; min-width: 1000px; }
  th { background: #162032; padding: 12px; text-align: center; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  td { padding: 8px 10px; border-top: 1px solid var(--border); text-align: center; vertical-align: middle; white-space: nowrap; }
  tr:hover { background: rgba(255,255,255,0.02); }

  img.team-logo { width: 32px; height: 32px; object-fit: contain; vertical-align: middle; margin: 0 5px; background: #ffffff; border-radius: 50%; padding: 2px; }
    
  .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; min-width: 80px; }
  .status-finished { background: rgba(51, 65, 85, 0.5); color: #cbd5e1; border: 1px solid #334155; }
  .status-live { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid #7f1d1d; animation: pulse 2s infinite; }
  .status-upcoming { background: rgba(14, 165, 233, 0.2); color: #7dd3fc; border: 1px solid #075985; }

  /* --- تنسيق القوائم المنسدلة للقنوات (Organized Dropdown) --- */
  .channel-select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23fbbf24%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: left 10px center; 
    background-size: 10px;
    padding-left: 25px; 
    text-align: center;
    color: #fbbf24;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    min-width: 150px;
    height: 32px;
    font-size: 12px;
    background-color: #162032; 
    border-color: #334155;
  }
  .channel-select:hover { border-color: #fbbf24; }
  .channel-select option { background-color: #0f172a; color: #f8fafc; padding: 10px; }

  .channel-input, .comm-input { width: 100%; min-width: 140px; height: 32px; font-size: 12px; text-align: center; }
  .channel-input { color: #4ade80; font-weight: bold; }
  .comm-input { color: #cbd5e1; }
    
  .output-area { position: sticky; top: 20px; }
  textarea#output { width: 100%; height: 400px; font-family: monospace; line-height: 1.5; color: #a5b4fc; resize: vertical; padding: 10px; }

  /* --- المودال (Modal) --- */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
  .modal-content { background-color: var(--bg-card); margin: 5% auto; padding: 20px; border: 1px solid var(--border); width: 95%; max-width: 600px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
  .server-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .server-row input { flex: 1; }
  .server-count-badge { background: var(--primary); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 5px; display: none; }

  #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: var(--bg-card); border-left: 4px solid var(--primary); padding: 12px 20px; border-radius: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease-out forwards; color: #fff; }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
    
  @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

  /* --- التجاوب (Responsive) --- */
  @media (max-width: 992px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .output-area { position: static; height: auto; }
  }
  @media (max-width: 768px) {
    body { padding: 10px; }
    h1 { font-size: 20px; }
    .controls { gap: 8px; justify-content: space-between; }
    .controls input[type="text"] { width: 100%; order: 3; }
    .controls select { flex-grow: 1; order: 2; }
    .controls button:first-child { flex-grow: 1; order: 1; }
    .controls .spacer { display: none; }
    .controls button.btn-primary, .controls button.btn-github, .controls button.btn-danger, .controls button.btn-success { 
        flex-grow: 1; order: 4; font-size: 12px; padding: 0 8px;
    }
  }
</style>
</head>
<body>

<h1>🎯 لوحة التحكم <span style="font-size:14px; background:var(--success); color:black; padding:2px 8px; border-radius:4px;">ULTRA TV</span></h1>

<div class="dashboard-grid">
    <div class="main-content">
        <div class="controls">
            <button class="btn-primary" onclick="fetchMatches()">🔄 تحديث</button>
            <select id="statusFilter" onchange="filterMatches()">
                <option value="all">🔍 الكل</option>
                <option value="Live">🔴 مباشر</option>
                <option value="Finished">🏁 انتهت</option>
                <option value="Not Started">⏳ قادمة</option>
            </select>
            <div class="spacer" style="flex-grow: 1;"></div> 
            <input type="text" id="searchInput" placeholder="بحث (فريق، دوري)...">
            <button class="btn-primary" onclick="processBulkInput()">📝 دمج</button>
            <button class="btn-github" onclick="loadFromGitHub()">📥 تحميل</button>
            <button class="btn-danger" onclick="clearFileInGitHub()">🗑️ مسح</button>
            <button class="btn-success" onclick="saveToGitHub()">💾 نشر</button>
        </div>

        <div class="stats-bar">
            <span class="stat-item">المباريات: <b id="statTotal">0</b></span>
            <span class="stat-item" style="color:#fca5a5">مباشر: <b id="statLive">0</b></span>
            <span class="stat-item" style="color:#22c55e">تم تحديد: <b id="statSelected">0</b></span>
        </div>

        <div class="bulk-container" style="margin-top:15px; display:none;" id="bulkSection">
            <textarea id="bulkInput" placeholder="لصق بيانات يدوية: الفريق 1 ضد الفريق 2, القناة, المعلق" style="height:80px; width:100%;"></textarea>
        </div>

        <div class="table-container" style="margin-top: 15px;">
            <table id="matchesTable">
                <thead>
                    <tr>
                        <th width="40">✔️</th>
                        <th width="70">الحالة</th>
                        <th>الفريق 1</th>
                        <th width="70">النتيجة</th>
                        <th>الفريق 2</th>
                        <th>الدوري</th>
                        <th width="90">الوقت</th>
                        <th>القناة الناقلة</th>
                        <th>المعلق</th>
                        <th width="50">سرفرات</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="output-area">
        <div class="controls" style="margin-bottom: 10px; justify-content: space-between;">
            <strong>📦 JSON الناتج</strong>
            <button onclick="copyJSON()" style="padding: 4px 8px; font-size: 11px;">📋 نسخ</button>
        </div>
        <textarea id="output" readonly></textarea>
    </div>
</div>

<div id="serverModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📡 إدارة السيرفرات</h3>
            <span style="cursor:pointer; font-size:24px;" onclick="closeServerModal()">&times;</span>
        </div>
        <div id="serverList"></div>
        <div style="margin-top: 15px; display:flex; gap:10px;">
            <button class="btn-primary" onclick="addServerLine()">+ إضافة سطر</button>
            <div style="flex-grow:1"></div>
            <button class="btn-success" onclick="saveServers()">حفظ وإغلاق</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
// --- Config ---
const config = {
    apiUrl: "https://raw.githubusercontent.com/ihabmalaouiH/ULTRATV/refs/heads/main/today.json",
    github: { 
        token: "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", 
        repo: "ihabmalaouiH/ULTRATV", 
        filePath: "today.json", 
        branch: "main" 
    }
};

// --- Elements ---
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
const matchesTbody = document.querySelector("#matchesTable tbody");
const outputTextarea = document.getElementById("output");
let currentMatchRow = null;

// --- Init ---
function initialize() {
    matchesTbody.addEventListener('change', updateStatsAndJSON);
    matchesTbody.addEventListener('input', updateStatsAndJSON);
    searchInput.addEventListener('input', filterMatches);
    fetchMatches();
}

// --- Helper: Parse Arabic Date (NO Timezone conversion) ---
function parseArabicMatchTime(dateStr, timeStr) {
    try {
        const dateParts = dateStr.match(/(\d{2})-(\d{2})-(\d{4})/);
        if (!dateParts) return null;
        const year = parseInt(dateParts[3]);
        const month = parseInt(dateParts[2]) - 1;
        const day = parseInt(dateParts[1]);

        let time = timeStr.replace('مساءً', 'PM').replace('صباحاً', 'AM')
                          .replace('مساء', 'PM').replace('صباح', 'AM')
                          .trim();
          
        let [timeRaw, modifier] = time.split(' ');
        let [hoursStr, minutes] = timeRaw.split(':');
        
        let hours = parseInt(hoursStr, 10);
          
        if (hours === 12) hours = 0;
        if (modifier === 'PM') hours += 12;
        
        // --- تمت إزالة تحويل التوقيت ليبقى كما هو في المصدر ---
        
        const dateObj = new Date(year, month, day, hours, parseInt(minutes));
        return dateObj;
    } catch (e) {
        console.error("Date Error", e);
        return new Date();
    }
}

// --- Main Fetch Logic ---
async function fetchMatches() {
    matchesTbody.innerHTML = `<tr><td colspan="10" style="padding:40px;">⏳ جاري جلب البيانات...</td></tr>`;
    try {
        const res = await fetch(`${config.apiUrl}?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const allMatches = await res.json(); 

        if (!Array.isArray(allMatches) || allMatches.length === 0) {
            return matchesTbody.innerHTML = `<tr><td colspan="10" style="padding:40px;">لا توجد مباريات.</td></tr>`;
        }

        allMatches.forEach(m => {
            const dateObj = parseArabicMatchTime(m.info.date, m.info.time);
            m._timestamp = dateObj ? dateObj.getTime() : 0;
        });

        allMatches.sort((a, b) => a._timestamp - b._timestamp);
        renderMatches(allMatches);
        showToast(`تم تحميل ${allMatches.length} مباراة`, 'success');

    } catch (err) {
        matchesTbody.innerHTML = `<tr><td colspan="10" style="color:var(--danger)">⚠️ خطأ: ${err.message}</td></tr>`;
        showToast("فشل الاتصال", 'error');
    }
}

// --- Helper to format channel names ---
function formatChannelName(name) {
    if (!name) return name;
    let formatted = name;
    if (formatted.includes("بي إن سبورت") || formatted.includes("بي ان سبورت") || formatted.includes("beIN Sports")) {
        formatted = formatted.replace(/بي [إا]ن سبورت|beIN Sports/gi, "beIN SPORTS");
        formatted = formatted.replace(/HD/gi, "").trim();
    }
    if (formatted.includes("ثمانية")) {
        formatted = formatted.replace("ثمانية", "Thmanyah").trim();
    }
    return formatted.replace(/\s+/g, ' ').trim();
}

// --- Render Table ---
function renderMatches(matches) {
    matchesTbody.innerHTML = "";
    
    matches.forEach(match => {
        const team1 = match.teams.home;
        const team2 = match.teams.away;
        const info = match.info;
        
        const startTime = Math.floor(match._timestamp / 1000);
        const matchDate = new Date(match._timestamp);
        const timeStr = matchDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        // --- STATUS LOGIC START (PURE API) ---
        // استخدام النص القادم من API مباشرة (match_status)
        let rawStatus = info.match_status || "لم تبدأ";
        let apiScore = info.current_score || "VS";

        let statusBadgeClass = "status-upcoming";
        let jsonStatus = "Not Started";

        // تحليل الحالة لتلوين البادج فقط، مع الاعتماد الكلي على نص API
        if (rawStatus.includes("انتهت") || rawStatus.includes("إنتهت") || rawStatus.includes("نهاية")) {
            statusBadgeClass = "status-finished";
            jsonStatus = "Finished";
        } else if (rawStatus.includes("لم تبدأ")) {
            statusBadgeClass = "status-upcoming";
            jsonStatus = "Not Started";
        } else {
            // أي حالة أخرى نصية (مثل: الشوط الأول، استراحة، دقيقة 80) تعتبر مباشر
            statusBadgeClass = "status-live";
            jsonStatus = "Live";
            if (!apiScore || apiScore === "VS") apiScore = "0 - 0";
        }
        // --- STATUS LOGIC END ---

        const defaultLogo = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z'/%3E%3C/svg%3E";

        // --- Channel Logic ---
        let channelCellHTML = '';
        let commCellHTML = '';
        
        if (match.channels && match.channels.length > 1) {
            let options = match.channels.map(ch => {
                let displayChannel = formatChannelName(ch.channel);
                return `<option value="${displayChannel}" data-commentator="${ch.commentator}">${displayChannel}</option>`;
            }).join('');
            
            channelCellHTML = `
                <select class="channel-select" onchange="updateRowCommentator(this)">
                    ${options}
                </select>
            `;
            commCellHTML = `<input type="text" value="${match.channels[0].commentator}" class="comm-input">`;
            
        } else {
            let chName = (match.channels && match.channels.length > 0) ? formatChannelName(match.channels[0].channel) : "غير معروف";
            let commName = (match.channels && match.channels.length > 0) ? match.channels[0].commentator : "";
            
            channelCellHTML = `<input type="text" value="${chName}" class="channel-input">`;
            commCellHTML = `<input type="text" value="${commName}" placeholder="المعلق" class="comm-input">`;
        }

        const tr = document.createElement("tr");
        tr.dataset.team1Name = team1.name;
        tr.dataset.team1Logo = team1.logo;
        tr.dataset.team2Name = team2.name;
        tr.dataset.team2Logo = team2.logo;
        tr.dataset.league = info.championship;
        tr.dataset.startTime = startTime;
        tr.dataset.jsonStatus = jsonStatus;
        tr.dataset.score = (apiScore === "VS") ? "" : apiScore;
        tr.dataset.servers = "[]"; 

        tr.innerHTML = `
            <td><input type="checkbox"></td>
            <td><span class="status-badge ${statusBadgeClass}">${rawStatus}</span></td>
            <td style="text-align:left"><img src="${team1.logo}" class="team-logo" referrerpolicy="no-referrer" onerror="this.src='${defaultLogo}'"> ${team1.name}</td>
            <td style="font-weight:bold; letter-spacing:2px; font-family:monospace;">${apiScore}</td>
            <td style="text-align:right">${team2.name} <img src="${team2.logo}" class="team-logo" referrerpolicy="no-referrer" onerror="this.src='${defaultLogo}'"></td>
            <td style="font-size:12px; color:#94a3b8">${info.championship}</td>
            <td dir="ltr" style="font-family:monospace; color:#fbbf24; white-space:nowrap;">${timeStr}</td>
            <td>${channelCellHTML}</td>
            <td>${commCellHTML}</td>
            <td>
                <button onclick="openServerModal(this)" style="padding:4px 8px;" class="btn-github">
                    <span class="server-count-badge">0</span> 📡
                </button>
            </td>
        `;
        matchesTbody.appendChild(tr);
    });
    updateStatsAndJSON();
    filterMatches();
}

function updateRowCommentator(selectElement) {
    const row = selectElement.closest('tr');
    const commInput = row.querySelector('.comm-input');
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const newCommentator = selectedOption.getAttribute('data-commentator');
    if (commInput) {
        commInput.value = newCommentator;
        updateStatsAndJSON();
    }
}

function openServerModal(btn) {
    currentMatchRow = btn.closest('tr');
    const serversData = JSON.parse(currentMatchRow.dataset.servers || "[]");
    const container = document.getElementById("serverList");
    container.innerHTML = "";
    if (serversData.length > 0) {
        serversData.forEach(srv => {
            const name = Object.keys(srv)[0];
            const url = Object.values(srv)[0];
            addServerLine(name, url);
        });
    } else {
        addServerLine(); 
    }
    document.getElementById("serverModal").style.display = "block";
}

function addServerLine(name = "", url = "") {
    const div = document.createElement("div");
    div.className = "server-row";
    div.innerHTML = `
        <input type="text" placeholder="اسم السيرفر" value="${name}" class="srv-name">
        <input type="text" placeholder="رابط السيرفر" value="${url}" class="srv-url">
        <button class="btn-danger" onclick="this.parentElement.remove()" style="padding: 5px 10px;">🗑️</button>
    `;
    document.getElementById("serverList").appendChild(div);
}

function saveServers() {
    if (!currentMatchRow) return;
    const rows = document.querySelectorAll("#serverList .server-row");
    const serversArray = [];
    rows.forEach(row => {
        const name = row.querySelector(".srv-name").value.trim();
        const url = row.querySelector(".srv-url").value.trim();
        if (name && url) {
            const obj = {};
            obj[name] = url;
            serversArray.push(obj);
        }
    });
    currentMatchRow.dataset.servers = JSON.stringify(serversArray);
    const badge = currentMatchRow.querySelector(".server-count-badge");
    badge.innerText = serversArray.length;
    badge.style.display = serversArray.length > 0 ? "inline-block" : "none";
    if (serversArray.length > 0) {
        currentMatchRow.querySelector("input[type='checkbox']").checked = true;
    }
    closeServerModal();
    updateStatsAndJSON();
    showToast("تم حفظ السيرفرات", "success");
}

function closeServerModal() {
    document.getElementById("serverModal").style.display = "none";
    currentMatchRow = null;
}

function filterMatches() {
    const term = searchInput.value.toLowerCase().trim();
    const status = statusFilter.value;
    const rows = matchesTbody.querySelectorAll('tr');
    rows.forEach(row => {
        const textMatch = (row.dataset.team1Name + row.dataset.team2Name + row.dataset.league).toLowerCase().includes(term);
        const statusMatch = status === 'all' || row.dataset.jsonStatus === status;
        row.style.display = (textMatch && statusMatch) ? '' : 'none';
    });
}

function updateStatsAndJSON() {
    const allRows = matchesTbody.querySelectorAll('tr');
    const selectedRows = matchesTbody.querySelectorAll("input[type='checkbox']:checked");
     
    document.getElementById("statTotal").innerText = allRows.length;
    document.getElementById("statSelected").innerText = selectedRows.length;
    document.getElementById("statLive").innerText = Array.from(allRows).filter(r => r.dataset.jsonStatus === "Live").length;

    const matchesArray = [];
    selectedRows.forEach(checkbox => {
        const row = checkbox.closest("tr");
        if (row.style.display === 'none') return;
        
        const d = row.dataset;
        let chInput = row.querySelector(".channel-input");
        let channelValue = "";
        
        if (chInput) {
            channelValue = chInput.value;
        } else {
            const chSelect = row.querySelector(".channel-select");
            channelValue = chSelect ? chSelect.value : "غير معروف";
        }

        const commInput = row.querySelector(".comm-input").value;
        const servers = JSON.parse(d.servers || "[]");

        matchesArray.push({
            team1Name: d.team1Name, team1Logo: d.team1Logo,
            team2Name: d.team2Name, team2Logo: d.team2Logo,
            startTime: parseInt(d.startTime, 10),
            league: d.league, 
            channel: channelValue,
            commentator: commInput,
            servers: servers 
        });
    });
    outputTextarea.value = JSON.stringify(matchesArray, null, 2);
}

function processBulkInput() {
    const input = document.getElementById("bulkInput");
    if(input.parentElement.style.display === "none") {
        input.parentElement.style.display = "block"; input.focus(); return;
    }
    const lines = input.value.trim().split('\n');
    if (!input.value.trim()) return;
    let count = 0;
    const rows = Array.from(matchesTbody.querySelectorAll('tr'));
    lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length < 3) return;
        const [matchStr, ch, comm] = parts;
        const [t1, t2] = matchStr.toLowerCase().split(' ضد ');
        if(!t1 || !t2) return;
        const row = rows.find(r => {
            const n1 = r.dataset.team1Name.toLowerCase();
            const n2 = r.dataset.team2Name.toLowerCase();
            return (n1.includes(t1.trim()) && n2.includes(t2.trim())) || (n1.includes(t2.trim()) && n2.includes(t1.trim()));
        });
        if (row) {
            row.querySelector("input[type='checkbox']").checked = true;
            let chField = row.querySelector(".channel-input") || row.querySelector(".channel-select");
            let formattedChannel = formatChannelName(ch.trim());
            
            if(chField.tagName === "INPUT") {
                chField.value = formattedChannel;
            }
            
            const commField = row.querySelector(".comm-input");
            commField.value = comm.trim();
            count++;
        }
    });
    updateStatsAndJSON();
    showToast(`تم دمج ${count} مباراة`, 'success');
    input.value = ""; input.parentElement.style.display = "none";
}

function copyJSON() {
    outputTextarea.select(); document.execCommand('copy');
    showToast('تم نسخ الكود!', 'success');
}

function showToast(msg, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span>${msg}</span>`;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s forwards';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// --- GitHub Functions ---
async function updateGitHubFile(content, msg) {
    const URL = `https://api.github.com/repos/${config.github.repo}/contents/${config.github.filePath}`;
    const headers = {"Authorization": `token ${config.github.token}`, "Content-Type": "application/json"};
    try {
        const refRes = await fetch(`${URL}?ref=${config.github.branch}`, { headers });
        let sha = refRes.ok ? (await refRes.json()).sha : null;
        const res = await fetch(URL, {method: "PUT", headers, body: JSON.stringify({ message: msg, content, branch: config.github.branch, sha })});
        if(res.ok) return {success:true};
        const err = await res.json();
        return {success:false, error: err.message};
    } catch (e) { return {success:false, error: "Network Error"}; }
}

async function saveToGitHub() {
    const val = outputTextarea.value;
    if(!val || val==="[]") return showToast("لا توجد بيانات", "error");
    showToast("جاري الحفظ...", "info");
    const res = await updateGitHubFile(btoa(unescape(encodeURIComponent(val))), "update matches.json");
    if(res.success) showToast("✅ تم الحفظ!", "success");
    else showToast("❌ فشل: " + res.error, "error");
}

async function clearFileInGitHub() {
    if(!confirm("مسح الملف؟")) return;
    const res = await updateGitHubFile(btoa("[]"), "clear matches");
    if(res.success) { outputTextarea.value = "[]"; showToast("🗑️ تم المسح", "success"); } 
    else showToast("خطأ: " + res.error, "error");
}

async function loadFromGitHub() {
    showToast("جاري التحميل...", "info");
    try {
        const res = await fetch(`https://api.github.com/repos/${config.github.repo}/contents/${config.github.filePath}?ref=${config.github.branch}`, {headers: {"Authorization": `token ${config.github.token}`}});
        if(res.ok) { outputTextarea.value = atob((await res.json()).content); showToast("📥 تم التحميل", "success"); } 
        else showToast("الملف غير موجود", "error");
    } catch(e) { showToast("خطأ شبكة", "error"); }
}

initialize();

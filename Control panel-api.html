<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - ULTRA TV</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg:       #080e1a;
    --bg-card:  #0d1626;
    --bg-row:   #111d2e;
    --border:   #1e2f45;
    --border-hi:#2a4060;
    --primary:  #3b82f6;
    --primary-dim: rgba(59,130,246,0.12);
    --success:  #22c55e;
    --warning:  #f59e0b;
    --danger:   #ef4444;
    --xtream:   #8b5cf6;
    --text:     #e8f0fe;
    --text-mid: #7a95b8;
    --text-dim: #3a5270;
    --live:     #ff3b3b;
    --gold:     #fbbf24;
    --font-main:'IBM Plex Sans Arabic', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; outline: none; margin: 0; padding: 0; }

  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* ═══ TOP BAR ═══ */
  .topbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .topbar-logo .badge {
    background: var(--success);
    color: #000;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .topbar-spacer { flex: 1; }
  .topbar-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-mid);
    background: var(--bg-row);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* ═══ MAIN LAYOUT ═══ */
  .page-wrap { display: grid; grid-template-columns: 1fr 320px; gap: 0; min-height: calc(100vh - 56px); }
  @media (max-width: 1200px) { .page-wrap { grid-template-columns: 1fr; } }

  .main-col { padding: 20px; overflow: hidden; }
  .side-col {
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    padding: 20px;
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  @media (max-width: 1200px) { .side-col { position: static; height: auto; border-right: none; border-top: 1px solid var(--border); } }

  /* ═══ SECTION HEADER ═══ */
  .section-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-hdr h2 { font-size: 13px; font-weight: 600; color: var(--text-mid); letter-spacing: 0.5px; text-transform: uppercase; }
  .section-hdr .pill {
    font-family: var(--font-mono);
    font-size: 10px;
    background: var(--primary-dim);
    color: var(--primary);
    border: 1px solid rgba(59,130,246,0.3);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ═══ CONTROLS ═══ */
  .controls-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }

  input, select, button, textarea {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .ctrl-btn {
    height: 34px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 7px;
  }
  .ctrl-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .ctrl-btn:active { transform: translateY(0); }

  .btn-primary   { background: var(--primary);  border-color: var(--primary);  color: #fff; }
  .btn-success   { background: #15803d;          border-color: #16a34a;         color: #fff; }
  .btn-danger    { background: #991b1b;          border-color: #ef4444;         color: #fff; }
  .btn-xtream    { background: #5b21b6;          border-color: var(--xtream);   color: #fff; }
  .btn-firebase  { background: #92400e;          border-color: var(--warning);  color: var(--gold); }
  .btn-ghost     { background: transparent;      border-color: var(--border);   color: var(--text-mid); }

  .search-box {
    height: 34px;
    padding: 0 12px;
    flex: 1;
    min-width: 160px;
  }
  .filter-select {
    height: 34px;
    padding: 0 10px;
    min-width: 130px;
  }

  /* ═══ STATS ═══ */
  .stats-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 110px;
  }
  .stat-card .stat-val {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }
  .stat-card .stat-lbl { font-size: 10px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-total .stat-val  { color: var(--text); }
  .stat-live .stat-val   { color: var(--live); }
  .stat-sel .stat-val    { color: var(--success); }
  .stat-tmr .stat-val    { color: var(--gold); }

  /* ═══ TABS (days) ═══ */
  .day-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .day-tab {
    height: 32px;
    padding: 0 16px;
    border-radius: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .day-tab:hover { border-color: var(--primary); color: var(--text); }
  .day-tab.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
  .day-tab .badge-ct {
    background: var(--border);
    color: var(--text-mid);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 10px;
    font-family: var(--font-mono);
  }
  .day-tab.active .badge-ct { background: var(--primary); color: #fff; }

  /* ═══ TABLE ═══ */
  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 980px; }

  thead th {
    background: #0a1220;
    padding: 10px 10px;
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid rgba(30,47,69,0.6);
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(59,130,246,0.04); }
  tbody tr.selected-row { background: rgba(59,130,246,0.07); }
  tbody tr.selected-row td:first-child { border-right: 3px solid var(--primary); }

  td {
    padding: 7px 10px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
  }

  /* Checkbox */
  .cb-wrap { display: flex; justify-content: center; align-items: center; }
  input[type="checkbox"] {
    width: 16px; height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
    border-radius: 4px;
  }

  /* Status badges */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .status-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .s-live     { background: rgba(255,59,59,0.15); color: #ff8080; border: 1px solid rgba(255,59,59,0.3); }
  .s-live::before { background: var(--live); animation: blink 1.2s infinite; }
  .s-finished { background: rgba(30,47,69,0.5); color: var(--text-dim); border: 1px solid var(--border); }
  .s-finished::before { background: var(--text-dim); }
  .s-upcoming { background: rgba(59,130,246,0.12); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
  .s-upcoming::before { background: #60a5fa; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Teams */
  .team-cell { display: flex; align-items: center; gap: 7px; }
  .team-cell.rev { flex-direction: row-reverse; }
  img.tlogo {
    width: 26px; height: 26px;
    object-fit: contain;
    border-radius: 50%;
    background: #fff;
    padding: 2px;
    flex-shrink: 0;
  }
  .team-name { font-size: 12px; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

  /* Score */
  .score-cell {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    min-width: 60px;
  }

  /* Time */
  .time-cell {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
  }

  /* League */
  .league-cell { font-size: 11px; color: var(--text-mid); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }

  /* Channel input / select */
  .channel-select, .channel-input {
    width: 100%; min-width: 150px;
    height: 30px; font-size: 11px;
    text-align: center;
    border-radius: 6px;
    padding: 0 8px;
  }
  .channel-select {
    color: var(--gold);
    font-weight: 600;
    background-color: var(--bg-row);
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Cpath fill='%23fbbf24' d='M5 7L0 2h10z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: left 8px center;
    background-size: 8px;
    padding-left: 22px;
    appearance: none;
  }
  .channel-select option { background: #0a1220; }
  .channel-input { color: #4ade80; font-weight: 600; }
  .comm-input  { width: 100%; min-width: 120px; height: 30px; font-size: 11px; text-align: center; border-radius: 6px; padding: 0 8px; color: var(--text-mid); }
  .loading-ch { color: var(--warning); font-size: 10px; animation: blink 1s infinite; }

  /* Server button */
  .srv-btn {
    background: var(--bg-row);
    border: 1px solid var(--border);
    color: var(--text-mid);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: border-color 0.15s;
  }
  .srv-btn:hover { border-color: var(--primary); color: var(--primary); }
  .srv-count {
    background: var(--primary);
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 10px;
    font-family: var(--font-mono);
    display: none;
  }

  /* ═══ SIDE PANEL ═══ */
  .side-label { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  #output {
    flex: 1;
    min-height: 300px;
    width: 100%;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
    color: #93c5fd;
    padding: 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    resize: vertical;
  }
  .copy-btn {
    width: 100%;
    height: 34px;
    border-radius: 7px;
    background: var(--bg-row);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .copy-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ═══ MODAL ═══ */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 500; justify-content: center; align-items: center; }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border-hi);
    border-radius: 14px;
    width: 95%;
    max-width: 580px;
    padding: 24px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-head h3 { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-close { background: none; border: none; color: var(--text-mid); font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .modal-close:hover { color: var(--danger); }
  .srv-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .srv-row input { flex: 1; height: 34px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  .srv-row button { height: 34px; padding: 0 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  /* ═══ LOGIN ═══ */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex; justify-content: center; align-items: center;
  }
  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border-hi);
    border-radius: 16px;
    padding: 40px 36px;
    width: 90%; max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .login-box h2 { font-size: 18px; color: var(--primary); margin-bottom: 24px; }
  .login-box input {
    width: 100%; height: 40px; padding: 0 14px;
    margin-bottom: 10px; border-radius: 8px; font-size: 13px;
    display: block;
  }
  .login-box .login-btn {
    width: 100%; height: 42px; font-size: 14px; font-weight: 700;
    border-radius: 8px; cursor: pointer; margin-top: 6px;
  }
  .login-err { color: var(--danger); font-size: 12px; margin-top: 10px; }

  /* ═══ TOASTS ═══ */
  #toasts { position: fixed; bottom: 20px; right: 20px; z-index: 9998; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    animation: toastIn 0.25s ease-out;
  }
  .toast.success { border-color: var(--success); }
  .toast.error   { border-color: var(--danger); }
  .toast.warning { border-color: var(--warning); }
  .toast-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .toast.success .toast-dot { background: var(--success); }
  .toast.error   .toast-dot { background: var(--danger); }
  .toast.warning .toast-dot { background: var(--warning); }
  .toast.info    .toast-dot { background: var(--primary); }

  @keyframes toastIn { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateX(30px); opacity: 0; } }

  /* Loading overlay */
  .fetch-progress {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-mid);
  }
  .fetch-progress .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bulk */
  .bulk-area { display: none; margin-bottom: 14px; }
  .bulk-area textarea { width: 100%; height: 70px; padding: 10px; font-size: 12px; border-radius: 8px; resize: none; }

  /* Empty */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }

  @media (max-width: 768px) {
    .topbar { padding: 0 14px; }
    .main-col { padding: 12px; }
    .controls-bar { gap: 6px; }
    .ctrl-btn, .search-box, .filter-select { height: 36px; }
    .stats-row .stat-card { min-width: 80px; }
  }
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-overlay">
  <div class="login-box">
    <h2>🔒 تسجيل الدخول</h2>
    <input type="email"    id="login-email" placeholder="البريد الإلكتروني">
    <input type="password" id="login-pass"  placeholder="كلمة المرور">
    <button id="login-btn" class="ctrl-btn btn-primary login-btn">دخول</button>
    <p class="login-err" id="login-error"></p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app" style="display:none;">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">
      🎯 ULTRA TV <span class="badge">ADMIN</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-date" id="clockDisplay"></div>
    <button class="ctrl-btn btn-ghost" style="height:32px; font-size:11px; padding:0 12px;" onclick="firebase.auth().signOut()">⏻ خروج</button>
  </div>

  <!-- PAGE GRID -->
  <div class="page-wrap">

    <!-- ═══ MAIN COLUMN ═══ -->
    <div class="main-col">

      <!-- Controls bar -->
      <div class="controls-bar">
        <button class="ctrl-btn btn-primary"  onclick="fetchMatchesForActiveDay()">🔄 تحديث</button>
        <select class="filter-select" id="statusFilter" onchange="filterMatches()">
          <option value="all">🔍 الكل</option>
          <option value="Live">🔴 مباشر</option>
          <option value="Finished">🏁 انتهت</option>
          <option value="Not Started">⏳ قادمة</option>
        </select>
        <input type="text" class="search-box" id="searchInput" placeholder="بحث بالفريق أو الدوري...">
        <div style="flex:1; min-width:0;"></div>
        <button class="ctrl-btn btn-ghost"     onclick="toggleBulk()">📝 إدخال يدوي</button>
        <button class="ctrl-btn btn-xtream"    onclick="autoFillFromXtream()">⚡ Xtream</button>
        <button class="ctrl-btn btn-firebase"  onclick="loadFromFirebase()">📥 استعادة</button>
        <button class="ctrl-btn btn-danger"    onclick="clearFirebase()">🗑️ مسح DB</button>
        <button class="ctrl-btn btn-success"   onclick="saveToFirebase()">🔥 نشر</button>
      </div>

      <!-- Bulk input -->
      <div class="bulk-area" id="bulkArea">
        <textarea id="bulkInput" placeholder="الفريق 1 ضد الفريق 2, القناة, المعلق (كل مباراة في سطر)"></textarea>
        <button class="ctrl-btn btn-primary" style="margin-top:6px;" onclick="processBulkInput()">✅ تطبيق</button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card stat-total">
          <div><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">مباريات</div></div>
        </div>
        <div class="stat-card stat-live">
          <div><div class="stat-val" id="statLive">0</div><div class="stat-lbl">مباشر</div></div>
        </div>
        <div class="stat-card stat-sel">
          <div><div class="stat-val" id="statSelected">0</div><div class="stat-lbl">محدد</div></div>
        </div>
        <div class="stat-card stat-tmr" id="statUpcomingCard">
          <div><div class="stat-val" id="statUpcoming">0</div><div class="stat-lbl">قادمة</div></div>
        </div>
      </div>

      <!-- Day tabs -->
      <div class="day-tabs">
        <button class="day-tab active" id="tab-today" onclick="switchDay(0)">اليوم <span class="badge-ct" id="ct-today">0</span></button>
        <button class="day-tab" id="tab-tomorrow" onclick="switchDay(1)">الغد <span class="badge-ct" id="ct-tomorrow">0</span></button>
      </div>

      <!-- Table -->
      <div class="table-wrap">

function getDateString(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);

function formatChannelName(name) {
  if (!name) return name;

}

async function fetchMatches(dateStr) {
  const tbody = document.getElementById('matchesTbody');

  try {

    const res  = await fetch(MY_PROXY + encodeURIComponent(url));
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    let matches = data.data || [];

    dayCounts[activeDay] = matches.length;
    document.getElementById(`ct-${activeDay === 0 ? 'today' : 'tomorrow'}`).textContent = matches.length;

    if (!matches.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">📭</div><p>لا توجد مباريات لهذا اليوم</p></div></td></tr>`;

    matches.sort((a,b) => a.match_timestamp - b.match_timestamp);
    await renderMatches(matches);

  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="10" style="padding:40px; color:var(--danger); text-align:center;">⚠️ فشل الاتصال: ${err.message}</td></tr>`;

    const t2l = m.away_team.image.startsWith('http') ? m.away_team.image : imgBase + m.away_team.image;
    const league   = m.championship.title;
    const timeStr  = m.match_time ? m.match_time.substring(0,5) : '00:00';

    let sClass = 's-upcoming', jsonStatus = 'Not Started', statusLabel = 'قادمة';
    let apiScore = 'VS';

    if ([4,5,-1].includes(m.status)) {
      sClass='s-finished'; jsonStatus='Finished'; statusLabel='انتهت';
      apiScore = `${m.home_scores} - ${m.away_scores}`;
    } else if (m.live===1 || [1,2,3].includes(m.status)) {
      sClass='s-live'; jsonStatus='Live'; statusLabel='مباشر';
      apiScore = `${m.home_scores} - ${m.away_scores}`;

    tr.dataset.team1Name  = t1;
    tr.dataset.team1Logo  = t1l;
    tr.dataset.team2Name  = t2;
    tr.dataset.team2Logo  = t2l;
    tr.dataset.league     = league;
    tr.dataset.startTime  = m.match_timestamp;
    tr.dataset.jsonStatus = jsonStatus;

      <td class="score-cell">${apiScore}</td>

        <img src="${t2l}" class="tlogo" referrerpolicy="no-referrer" onerror="this.src='${defaultLogo}'">

// ─────────── Bulk Input ───────────
function toggleBulk() {
  const area = document.getElementById('bulkArea');
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function processBulkInput() {
  const lines = document.getElementById('bulkInput').value.trim().split('\n');
  const rows  = [...document.querySelectorAll('#matchesTbody tr')];
  let count = 0;
  lines.forEach(line => {
    const parts = line.split(',');
    if (parts.length < 3) return;
    const [matchStr, ch, comm] = parts;
    const sides = matchStr.split(' ضد ');
    if (sides.length < 2) return;
    const [t1, t2] = sides.map(s => s.toLowerCase().trim());
    const row = rows.find(r => {
      const n1 = r.dataset.team1Name?.toLowerCase();
      const n2 = r.dataset.team2Name?.toLowerCase();
      return (n1?.includes(t1) && n2?.includes(t2)) || (n1?.includes(t2) && n2?.includes(t1));
    });
    if (row) {
      row.querySelector('input[type="checkbox"]').checked = true;
      row.classList.add('selected-row');
      const ci = row.querySelector('.channel-input');
      const cs = row.querySelector('.channel-select');
      const fc = formatChannelName(ch.trim());
      if (ci) ci.value = fc;
      if (cs) cs.value = fc;
      const cm = row.querySelector('.comm-input');
      if (cm) cm.value = comm.trim();
      count++;
    }
  });
  updateStatsAndJSON();
  showToast(`تم دمج ${count} مباراة`, 'success');
  document.getElementById('bulkInput').value = '';
  document.getElementById('bulkArea').style.display = 'none';
}

// ─────────── Firebase ───────────
async function saveToFirebase(silent = false) {
  const val = document.getElementById('output').value;
  if (!val || val === '[]') {
    if (!silent) showToast('لا توجد مباريات محددة', 'error');
    return;
  }
  if (!silent && !confirm('سيتم استبدال مباريات Firebase الحالية. هل أنت متأكد؟')) return;

  if (!silent) showToast('جاري النشر في Firebase…', 'info');
  try {
    const matches  = JSON.parse(val);
    const snap     = await db.collection('matches').get();
    const batch    = db.batch();
    snap.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();

    for (const m of matches) await db.collection('matches').add(m);

    if (!silent) showToast(`✅ تم نشر ${matches.length} مباراة`, 'success');
    document.getElementById('fbStats').innerHTML = `آخر نشر: <b style="color:var(--success)">${matches.length} مباراة</b><br>الوقت: ${new Date().toLocaleTimeString('ar-DZ')}`;
  } catch (e) {
    showToast('❌ خطأ: ' + e.message, 'error');
  }
}

async function clearFirebase() {
  if (!confirm('⚠️ سيتم مسح جميع المباريات من قاعدة البيانات!')) return;
  try {
    const snap  = await db.collection('matches').get();
    const batch = db.batch();
    snap.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    document.getElementById('output').value = '[]';
    document.getElementById('fbStats').innerHTML = 'قاعدة البيانات فارغة';
    showToast('🗑️ تم المسح', 'success');
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
  }
}

async function loadFromFirebase() {
  showToast('جاري الاستعادة من Firebase…', 'info');
  try {
    const snap = await db.collection('matches').orderBy('startTime').get();
    if (snap.empty) { showToast('قاعدة البيانات فارغة', 'warning'); return; }

    const saved = snap.docs.map(d => d.data());
    const rows  = [...document.querySelectorAll('#matchesTbody tr')];

    // uncheck all first
    rows.forEach(r => {
      const cb = r.querySelector('input[type="checkbox"]');
      if (cb) { cb.checked = false; r.classList.remove('selected-row'); }
    });

    let restored = 0;
    saved.forEach(sm => {
      const row = rows.find(r => r.dataset.team1Name === sm.team1Name && r.dataset.team2Name === sm.team2Name);
      if (!row) return;
      restored++;
      const cb = row.querySelector('input[type="checkbox"]');
      if (cb) { cb.checked = true; row.classList.add('selected-row'); }

      const ci = row.querySelector('.channel-input');
      const cs = row.querySelector('.channel-select');
      if (ci) ci.value = sm.channel || '';
      if (cs) cs.value = sm.channel || '';

      const cm = row.querySelector('.comm-input');
      if (cm) cm.value = sm.commentator || '';

      if (sm.servers?.length) {
        row.dataset.servers = JSON.stringify(sm.servers);
        const badge = row.querySelector('.srv-count');
        if (badge) { badge.textContent = sm.servers.length; badge.style.display = 'inline-block'; }
      }
    });
    updateStatsAndJSON();
    showToast(`📥 تم استعادة ${restored} مباراة`, 'success');
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
  }
}

// ─────────── Xtream ───────────
async function autoFillFromXtream() {
  const allRows = document.querySelectorAll('#matchesTbody tr');
  if (!allRows.length) return showToast('لا توجد مباريات', 'error');
  showToast('جاري الاتصال بـ Xtream…', 'info');
  try {
    const api = `${xtreamConfig.fetchUrl}/player_api.php?username=${xtreamConfig.username}&password=${xtreamConfig.password}&action=get_live_streams`;
    const res  = await fetch(api);
    if (!res.ok) throw new Error('فشل الاتصال');
    const chData = await res.json();
    if (!Array.isArray(chData)) throw new Error('صيغة غير صحيحة');
    showToast(`تم جلب ${chData.length} قناة. جاري المطابقة…`, 'success');

    let filled = 0;
    const priority = ['4k','fhd','hevc','hd','sd','low'];

    allRows.forEach(row => {
      let name = '';
      const ci = row.querySelector('.channel-input');
      const cs = row.querySelector('.channel-select');
      if (ci) name = ci.value.trim();
      else if (cs) name = cs.value.trim();
      if (!name || !name.toLowerCase().includes('bein sport')) return;

      const clean = name.toLowerCase().replace(/[^a-z0-9]/g,'');
      const matched = chData.filter(c => c.name.toLowerCase().replace(/[^a-z0-9]/g,'').includes(clean));
      if (!matched.length) return;

      matched.sort((a,b) => {
        let ia = priority.findIndex(q => a.name.toLowerCase().includes(q));
        let ib = priority.findIndex(q => b.name.toLowerCase().includes(q));
        if (ia===-1) ia=99; if (ib===-1) ib=99; return ia-ib;
      });

      const servers = [];
      matched.forEach(c => {
        const l = c.name.toLowerCase();
        let label = null;
        if (l.includes('4k'))  label='4K';
        else if (l.includes('fhd')) label='FHD';
        else if (l.includes('hd'))  label='HD';
        else if (l.includes('sd'))  label='SD';
        else if (l.includes('low')) label='LOW';
        if (!label) return;
        const obj = {};
        obj[label] = `${xtreamConfig.streamHost}/${xtreamConfig.username}/${xtreamConfig.password}/${c.stream_id}`;
        servers.push(obj);
      });

      if (servers.length) {
        row.dataset.servers = JSON.stringify(servers);
        const badge = row.querySelector('.srv-count');
        if (badge) { badge.textContent = servers.length; badge.style.display = 'inline-block'; }
        filled++;
      }
    });

    updateStatsAndJSON();
    if (filled > 0) showToast(`✅ تم إضافة سيرفرات لـ ${filled} مباراة`, 'success');
    else alert('لم يُعثر على قنوات beIN Sports مطابقة.');
  } catch (e) {
    showToast('⚠️ ' + e.message, 'error');
  }
}

// ─────────── Server Modal ───────────
function openServerModal(btn) {
  currentMatchRow = btn.closest('tr');
  const servers = JSON.parse(currentMatchRow.dataset.servers || '[]');
  const list = document.getElementById('serverList');
  list.innerHTML = '';
  if (servers.length) servers.forEach(s => addServerLine(Object.keys(s)[0], Object.values(s)[0]));
  else addServerLine();
  document.getElementById('serverModal').classList.add('open');
}

function addServerLine(name='', url='') {
  const div = document.createElement('div');
  div.className = 'srv-row';
  div.innerHTML = `
    <input type="text" placeholder="الاسم (مثل: HD)" value="${name}" class="srv-name" style="min-width:90px; max-width:110px;">
    <input type="text" placeholder="رابط السيرفر" value="${url}" class="srv-url">
    <button type="button" class="ctrl-btn btn-ghost" onclick="moveSrv(this,-1)" style="padding:0 8px; height:30px;">▲</button>
    <button type="button" class="ctrl-btn btn-ghost" onclick="moveSrv(this,1)"  style="padding:0 8px; height:30px;">▼</button>
    <button type="button" class="ctrl-btn btn-danger" onclick="this.parentElement.remove()" style="padding:0 10px; height:30px;">🗑</button>`;
  document.getElementById('serverList').appendChild(div);
}

function moveSrv(btn, dir) {
  const row = btn.parentElement;
  if (dir===-1 && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
  else if (dir===1 && row.nextElementSibling)  row.parentNode.insertBefore(row.nextElementSibling, row);
}

function saveServers() {
  if (!currentMatchRow) return;
  const srvArr = [];
  document.querySelectorAll('#serverList .srv-row').forEach(r => {
    const name = r.querySelector('.srv-name').value.trim();
    const url  = r.querySelector('.srv-url').value.trim();
    if (name && url) { const o={}; o[name]=url; srvArr.push(o); }
  });
  currentMatchRow.dataset.servers = JSON.stringify(srvArr);
  const badge = currentMatchRow.querySelector('.srv-count');
  if (badge) { badge.textContent = srvArr.length; badge.style.display = srvArr.length ? 'inline-block' : 'none'; }
  if (srvArr.length) {
    const cb = currentMatchRow.querySelector('input[type="checkbox"]');
    cb.checked = true; currentMatchRow.classList.add('selected-row');
  }
  closeServerModal();
  updateStatsAndJSON();
  showToast('تم حفظ السيرفرات', 'success');
}

function closeServerModal() {
  document.getElementById('serverModal').classList.remove('open');
  currentMatchRow = null;
}

// Close modal on backdrop click
document.getElementById('serverModal').addEventListener('click', e => {
  if (e.target === document.getElementById('serverModal')) closeServerModal();
});

// ─────────── Misc ───────────
function copyJSON() {
  const out = document.getElementById('output');
  out.select();
  document.execCommand('copy');
  showToast('✅ تم نسخ JSON', 'success');
}

function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span class="toast-dot"></span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.animation = 'toastOut 0.25s forwards'; setTimeout(()=>t.remove(), 250); }, 3000);
}
</script>

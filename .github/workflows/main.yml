name: UltraTV-Final-Success

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو (IPTV)'
        required: true
        default: ''
      stream_key:
        description: 'مفتاح بث فيسبوك (Stream Key)'
        required: true

jobs:
  streaming_job:
    runs-on: ubuntu-latest
    steps:
      - name: Start Streaming with Docker
        run: |
          docker run --rm jrottenberg/ffmpeg:4.4-ubuntu \
          -thread_queue_size 1024 \
          -re -fflags +genpts+igndts \
          -i "${{ github.event.inputs.video_url }}" \
          -user_agent "Mozilla/5.0" \
          -c:v libx264 -preset ultrafast -tune zerolatency \
          -r 30 -g 60 -keyint_min 60 -sc_threshold 0 \
          -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -pix_fmt yuv420p -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ github.event.inputs.stream_key }}"

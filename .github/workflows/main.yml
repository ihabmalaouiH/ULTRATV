name: UltraTV-Final-Success

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو (IPTV)'
        required: true
        default: 'http://cyber4k.sytes.net:8080/primetv6885/Telegram@primetvoff/2381'
      stream_key:
        description: 'مفتاح بث فيسبوك (Stream Key)'
        required: true

jobs:
  streaming_job:
    runs-on: ubuntu-latest
    steps:
      - name: Start Streaming with Docker
        run: |
          docker run --rm jrottenberg/ffmpeg:4.4-ubuntu \
          -re -i "${{ github.event.inputs.video_url }}" \
          -user_agent "Mozilla/5.0" \
          -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ github.event.inputs.stream_key }}"

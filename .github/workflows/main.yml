name: UltraTV-Dynamic-Streamer

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط القرآن أو المباراة'
        required: true
        default: 'http://ibo.lynxiptv.com/334188914694/VzDd0nBIgq/66384'

jobs:
  streaming_job:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Force Start Stream
        run: |
          # نستخدم rtmp بدلاً من rtmps لتجاوز مشاكل الأمان TLS
          # ونضيف خيارات لتثبيت الإرسال ومنع الانقطاع
          ffmpeg -re -i "${{ github.event.inputs.video_url }}" \
          -user_agent "Mozilla/5.0" \
          -c:v libx264 -preset superfast -b:v 2500k \
          -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv -flvflags no_duration_filesize \
          "rtmp://live-api-s.facebook.com:80/rtmp/FB-122183660390765411-0-Ab6BxXZD6RCKMGxdmzfqy8BT"

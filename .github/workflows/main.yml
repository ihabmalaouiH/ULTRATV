name: UltraTV-Final-Broadcaster

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط القرآن أو المباراة'
        required: true
        default: 'http://ibo.lynxiptv.com/334188914694/VzDd0nBIgq/66384'

jobs:
  streaming_job:
    runs-on: ubuntu-latest
    # نستخدم حاوية مجهزة بأحدث مكتبات SSL و FFmpeg
    container:
      image: jrottenberg/ffmpeg:4.4-ubuntu
    steps:
      - name: Start Final Stream
        run: |
          ffmpeg -re -i "${{ github.event.inputs.video_url }}" \
          -user_agent "Mozilla/5.0" \
          -c:v libx264 -preset superfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/FB-122183660390765411-0-Ab6BxXZD6RCKMGxdmzfqy8BT"

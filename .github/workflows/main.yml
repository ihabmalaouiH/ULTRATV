name: UltraTV-Final-Success

on:
  workflow_dispatch:
    inputs:
      hf_url:
        description: 'رابط Hugging Face المباشر (m3u8)'
        required: true
        default: 'https://ihab-ultra-1-biensport1.hf.space/stream.m3u8'
      stream_key:
        description: 'مفتاح بث فيسبوك (Stream Key)'
        required: true

jobs:
  streaming_job:
    runs-on: ubuntu-latest
    steps:
      - name: Start Streaming Relay (Bridge Mode)
        run: |
          docker run --rm jrottenberg/ffmpeg:4.4-ubuntu \
          -re -i "${{ github.event.inputs.hf_url }}" \
          -c:v copy -c:a copy \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${{ github.event.inputs.stream_key }}"

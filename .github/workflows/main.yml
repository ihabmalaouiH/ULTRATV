name: UltraTV-Live-Streamer
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'ضع رابط الفيديو هنا'
        required: true
        default: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          ffmpeg -re -i "${{ github.event.inputs.video_url }}" \
          -c:v libx264 -preset superfast -b:v 2500k -f flv \
          "rtmps://live-api-s.facebook.com:443/rtmp/FB-122183660390765411-0-Ab6BxXZD6RCKMGxdmzfqy8BT"

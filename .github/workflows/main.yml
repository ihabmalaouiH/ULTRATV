name: Ultra TV 24/7 (Fixed)
on:
  workflow_dispatch: # زر التشغيل اليدوي

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 ساعات

    steps:
    - name: Setup Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg python3 wget

    - name: Download Font (Fixed Link)
      # تم تصحيح الرابط هنا ليعمل بنجاح
      run: wget https://raw.githubusercontent.com/google/fonts/main/ofl/roboto/Roboto-Bold.ttf -O font.ttf

    - name: Start Broadcast
      run: |
        # 1. تشغيل السيرفر الداخلي
        mkdir stream
        cd stream
        python3 -m http.server 8080 &
        
        # 2. تشغيل النفق (Serveo)
        # هام: إذا لم يعمل الرابط، غير كلمة ihab-ultra-tv لاسم آخر
        ssh -o StrictHostKeyChecking=no -R ihab-ultra-tv:80:localhost:8080 serveo.net &
        sleep 10
        
        # 3. طباعة الرابط
        echo "-----------------------------------------------------"
        echo " YOUR LINK: https://ihab-ultra-tv.serveo.net/ihabTV.m3u8 "
        echo "-----------------------------------------------------"
        
        # 4. تشغيل البث (FFmpeg)
        # ملاحظة: تأكد أن رابط القناة (lionzhd...) ما زال يعمل، وإلا استبدله
        ffmpeg -re -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -timeout 20000000 \
        -i "

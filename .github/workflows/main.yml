name: UltraTV-Live-Streamer
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو'
        required: true
        default: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Streaming
        run: |
          ffmpeg -re -i "${{ github.event.inputs.video_url }}" \
          -c:v libx264 -preset superfast -b:v 2500k \
          -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/ضع_مفتاح_البث_هنا"
